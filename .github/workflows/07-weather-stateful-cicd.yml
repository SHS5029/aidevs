# GitHub Actions 목록에 표시되는 Workflow 이름입니다.
name: 07 Stateful Weather CI CD

# Redis·PostgreSQL은 이 Pipeline에서 다루지 않습니다. 외부 관리형 저장소의 접속 URL을
# 서버의 .env.docker에 입력하며, CI는 Application 3개(MCP·Backend·Frontend)만 검사합니다.
on:
  push:
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/backend/**"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/frontend/**"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/mcp_server/**"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/compose.application.yml"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/.env.docker.example"
      - ".github/workflows/07-weather-stateful-cicd.yml"
  pull_request:
    paths:
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/backend/**"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/frontend/**"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/mcp_server/**"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/compose.application.yml"
      - "07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/.env.docker.example"
      - ".github/workflows/07-weather-stateful-cicd.yml"
  # Actions 화면에서 사람이 직접 배포를 시작할 때 사용합니다.
  workflow_dispatch:
    inputs:
      deploy:
        description: "Deploy 06 application to AWS EC2"
        required: true
        type: boolean
        default: false

# Source를 읽기만 하므로 최소 권한만 부여합니다.
permissions:
  contents: read

# 같은 브랜치의 배포가 겹치지 않게 순서대로 실행합니다.
concurrency:
  group: weather-stateful-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      # 세 Component의 requirements.txt를 Cache Key로 사용합니다. 경로는 Git 루트 기준입니다.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/backend/requirements.txt
            07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/frontend/requirements.txt
            07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/mcp_server/requirements.txt
      - name: Install backend test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest
      # Redis·PostgreSQL·MCP·LLM을 모두 Fake로 교체한 계약 Test입니다. 외부 연결이 없습니다.
      - name: Test backend contract with Fake stores
        working-directory: 07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/backend
        run: python -m pytest test_app.py -q
      # Secret이 없는 Template을 그대로 복사합니다. CI는 실제 저장소 URL과 API Key를 사용하지 않습니다.
      - name: Prepare Docker environment file without secrets
        run: cp .env.docker.example .env.docker
      - name: Validate application Compose
        run: docker compose -f compose.application.yml config --quiet
      # Container를 실행하지 않고 세 Image를 만들 수 있는지만 확인합니다. Registry Push는 하지 않습니다.
      - name: Build application images
        run: docker compose -f compose.application.yml build

  deploy-application:
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.deploy)
    needs: test-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Configure verified SSH identity
        env:
          SSH_PRIVATE_KEY: ${{ secrets.AWS_SSH_PRIVATE_KEY }}
          AWS_SSH_KNOWN_HOSTS: ${{ secrets.AWS_SSH_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$AWS_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
      # .env.docker는 Git에 없으므로 서버에 먼저 만들어 둔 파일이 덮어써지지 않습니다.
      - name: Copy application source
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'mkdir -p ~/weather-stateful'
          scp -r 07_multi-agent-service-ops/00_runtime-and-deployment/06_weather-mcp-stateful-deployment/. "$AWS_USER@$AWS_HOST:~/weather-stateful/"
      # 서버의 .env.docker에 입력된 관리형 Redis·PostgreSQL URL로 Application만 교체합니다.
      - name: Deploy application and verify readiness
        env:
          AWS_HOST: ${{ secrets.AWS_HOST }}
          AWS_USER: ${{ secrets.AWS_USER }}
        run: |
          ssh "$AWS_USER@$AWS_HOST" 'cd ~/weather-stateful && test -f .env.docker && docker compose -f compose.application.yml config --quiet && docker compose -f compose.application.yml up -d --build --force-recreate weather-mcp backend frontend && curl --fail --retry 18 --retry-delay 5 http://127.0.0.1:8000/health/ready'
